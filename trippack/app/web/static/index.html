<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripPack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B14F2E'/%3E%3Cpath d='M12 11.5a4 4 0 0 1 8 0' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Crect x='5' y='12' width='22' height='12' rx='3.5' fill='%23fff'/%3E%3Crect x='14' y='12' width='4' height='12' fill='%23F0B440'/%3E%3C/svg%3E">
<script>
/* Home Assistant serves this panel from its own origin, so the parent document
   is readable and its resolved theme variables can be borrowed — including the
   ones a custom theme sets. If that ever stops being true the catch runs and
   the Home Assistant defaults baked into style.css stand instead. */
(function () {
  var MAP = {
    "--bg": "--primary-background-color",
    "--card": "--card-background-color",
    "--text": "--primary-text-color",
    "--muted": "--secondary-text-color",
    "--line": "--divider-color",
    "--accent": "--primary-color",
    "--radius": "--ha-card-border-radius"
  };
  function sync() {
    try {
      if (!window.parent || window.parent === window) { return; }
      var theirs = window.parent.getComputedStyle(window.parent.document.documentElement);
      var found = {};
      for (var name in MAP) {
        var value = theirs.getPropertyValue(MAP[name]).trim();
        if (value) { found[name] = value; }
      }
      // All or nothing on the two that decide light vs dark: half a theme is
      // worse than none, because the fallback below is internally consistent.
      if (!found["--bg"] || !found["--text"]) { return; }
      var ours = document.documentElement.style;
      for (var key in found) { ours.setProperty(key, found[key]); }
      document.documentElement.setAttribute("data-theme", "ha");
    } catch (err) {
      /* Not same-origin, or no parent: style.css already carries the defaults. */
    }
  }
  sync();
  window.addEventListener("focus", sync);
  document.addEventListener("visibilitychange", sync);
})();
</script>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<!-- Home Assistant already draws a header with the panel title above this
     frame, so the page starts with the trip itself. -->
<header class="strip">
  <span id="trip-name" class="trip-name">TripPack</span>
  <span class="rail"><span id="rail-done" class="rail-done"></span></span>
  <span id="progress-text" class="progress-text"></span>
</header>

<main>
  <!-- ------------------------------------------------ pack -->
  <section id="view-pack" class="view">
    <div class="add-row">
      <input id="add-input" type="search" autocomplete="off" placeholder="Add something to the list">
      <button id="add-new" class="text-button" hidden>New item</button>
    </div>
    <ul id="add-results" class="results" hidden></ul>

    <button id="waiting" class="review-row" hidden>
      <span id="waiting-text"></span>
      <span class="review-cue">Review</span>
    </button>

    <div id="pack-list"></div>

    <div class="list-footer">
      <button class="text-button" id="show-skipped">Show what you left behind</button>
    </div>
  </section>

  <!-- ------------------------------------------------ days -->
  <section id="view-days" class="view" hidden>
    <ol id="day-list" class="timeline"></ol>
  </section>

  <!-- ------------------------------------------------ items -->
  <section id="view-items" class="view" hidden>
    <div class="add-row">
      <input id="item-filter" type="search" autocomplete="off" placeholder="Search the catalogue">
      <button class="filled" id="item-new">Add item</button>
    </div>
    <div id="catalog-list"></div>
  </section>

  <!-- ------------------------------------------------ trips -->
  <section id="view-trips" class="view" hidden>
    <div id="trip-list"></div>
    <div class="card">
      <h2>Start another trip</h2>
      <label>Name<input id="new-trip-name" type="text" placeholder="Ardennen december"></label>
      <div class="two">
        <label>First day<input id="new-trip-start" type="date"></label>
        <label>Last day<input id="new-trip-end" type="date"></label>
      </div>
      <button class="filled" id="new-trip-save">Create trip</button>
    </div>
  </section>
</main>

<!-- ------------------------------------------------ suggestion sheet -->
<div id="tray" class="tray" hidden>
  <div class="tray-grip"></div>
  <div class="tray-head">
    <h2 id="tray-title">Bring these too?</h2>
    <span id="tray-count" class="tray-count"></span>
  </div>
  <div id="tray-name" class="tray-name"></div>
  <div id="tray-note" class="tray-note"></div>
  <div class="tray-actions">
    <button class="filled" id="tray-add">Add</button>
    <button class="outlined" id="tray-skip">Not this trip</button>
  </div>
  <div class="tray-foot">
    <button class="text-button" id="tray-close">Done</button>
    <button class="text-button" id="tray-all" hidden>Add all</button>
  </div>
</div>

<!-- ------------------------------------------------ bottom nav -->
<nav class="nav" role="tablist">
  <button class="tab is-active" data-tab="pack" role="tab" aria-label="Pack">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v12H4z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
    <span>Pack</span>
  </button>
  <button class="tab" data-tab="days" role="tab" aria-label="Days">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
    <span>Days</span>
  </button>
  <button class="tab" data-tab="items" role="tab" aria-label="Items">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span>Items</span>
  </button>
  <button class="tab" data-tab="trips" role="tab" aria-label="Trips">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span>Trips</span>
  </button>
</nav>

<!-- ------------------------------------------------ sheets -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="text-button" id="sheet-close">Close</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="static/app.js"></script>
</body>
</html>
