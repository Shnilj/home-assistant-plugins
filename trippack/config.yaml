---
name: TripPack
version: "0.1.1"
slug: trippack
description: >-
  Packing lists that build themselves from your itinerary, and ask about the
  things that travel with what you just packed.
url: https://github.com/Shnilj/home-assistant-plugins/tree/main/trippack
codenotary: shniljj@gmail.com
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8097
panel_icon: mdi:bag-personal
panel_title: TripPack
# Persistent, user-visible folder for the packing data (trippack.json).
# Mounted at /config inside the container; browse it via Samba / File editor
# under /addon_configs/<this-addon-slug>/. Deliberately NOT the whole Home
# Assistant config directory — this add-on has no business in there.
map:
  - addon_config:rw
options:
  log_level: info
  data_file: /config/trippack.json
schema:
  log_level: list(debug|info|warning|error)
  data_file: str
