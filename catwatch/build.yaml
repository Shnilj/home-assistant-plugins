# Per-architecture base image. Debian bases are used (rather than Alpine) so
# that numpy / opencv-python-headless install from prebuilt manylinux wheels
# instead of having to compile against musl.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
labels:
  org.opencontainers.image.title: CatWatch
  org.opencontainers.image.source: https://github.com/jensdescamps/home-assistant-plugins
