configuration:
  rtsp_url:
    name: Camera RTSP URL
    description: >-
      Full RTSP stream URL of the camera watching the food bowls, e.g.
      rtsp://user:pass@192.168.1.50:554/stream1
  detection_fps:
    name: Detection frame rate
    description: >-
      How many frames per second to analyse. 2-4 is plenty and keeps CPU low.
  motion_sensitivity:
    name: Motion sensitivity
    description: >-
      Pixel-change threshold (1 = very sensitive, 100 = only large changes).
  motion_min_area:
    name: Minimum motion area
    description: >-
      Smallest changed area (in pixels) that counts as motion. Raise it to
      ignore small movements; lower it if a cat is far from the camera.
  eating_dwell_seconds:
    name: Eating dwell time
    description: >-
      A cat must stay in the bowl region this many seconds before it counts as
      "eating". Filters out cats just passing by.
  meal_cooldown_minutes:
    name: Meal cooldown
    description: >-
      Minimum minutes between counted meals for the same cat. Repeated visits
      within this window are treated as one meal, so a cat grazing at the bowl
      isn't counted dozens of times.
  drink_dwell_seconds:
    name: Drinking dwell time
    description: >-
      How long a cat must stay at a water zone before it counts as drinking.
      Drinking is briefer than eating, so this is usually shorter.
  drink_cooldown_minutes:
    name: Drink cooldown
    description: >-
      Minimum minutes between counted drinks for the same cat.
  presence_grace_seconds:
    name: Presence grace period
    description: >-
      Seconds of no motion tolerated before a visit is considered over. Bridges
      the brief gaps when a still cat blends into the background.
  zone_coverage:
    name: Zone coverage threshold
    description: >-
      Fraction of a bowl zone the cat must cover (0-1) before it counts as using
      that zone. Higher = the cat must be more squarely over the bowl.
  require_lean_in:
    name: Require lean-in posture
    description: >-
      Only count eating/drinking when the cat is bent over the bowl (body rising
      above the zone), not merely sitting inside a large zone. Turn off if your
      camera looks straight down.
  history_hours:
    name: History retention (hours)
    description: >-
      How long to keep event snapshots in the History timeline. Older events and
      their images are deleted automatically.
  recognizer:
    name: Recognizer
    description: >-
      "embedding" uses a local neural network (more accurate, robust to lighting;
      recommended). "signature" uses a lighter colour/pattern method. Switching
      recognizers requires retraining (click Train in the web UI).
  recognition_margin:
    name: Recognition margin
    description: >-
      How dominant the winning cat must be across a visit (0-1) before the event
      is attributed. Higher = fewer wrong guesses but more visits left unattributed.
  cats:
    name: Cat names
    description: >-
      The names of your cats. One Home Assistant entity set is created per name.
  classifier_confidence:
    name: Recognition confidence threshold
    description: >-
      Minimum confidence (0-1) to name a cat. Below this it reports "unknown".
  save_captures:
    name: Save captures for training
    description: >-
      Save each detected cat crop so you can label it in the web UI and improve
      recognition over time.
  jpeg_quality:
    name: Snapshot JPEG quality
    description: JPEG quality (30-100) for saved snapshots and the MQTT image.
  log_level:
    name: Log level
    description: Verbosity of the add-on log.
network: {}
