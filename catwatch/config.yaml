name: CatWatch
version: "0.1.3"
slug: catwatch
description: >-
  Motion-triggered snapshots of the food bowls with local AI that recognises
  which cat is eating, published to Home Assistant over MQTT.
url: https://github.com/jensdescamps/home-assistant-plugins/tree/main/catwatch
codenotary: shniljj@gmail.com
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: manual
# Web UI in the HA sidebar (no exposed port needed).
ingress: true
ingress_port: 8099
panel_icon: mdi:cat
panel_title: CatWatch
# Needed so we can auto-configure the MQTT broker connection from the
# Mosquitto add-on / configured MQTT service.
services:
  - mqtt:need
# Persistent, user-visible folder for snapshots and the training dataset.
# Mounted at /config inside the container (browse it via Samba / File editor
# under /addon_configs/<this-addon-slug>/).
map:
  - addon_config:rw
options:
  rtsp_url: ""
  detection_fps: 3
  motion_sensitivity: 25
  motion_min_area: 1500
  eating_dwell_seconds: 5
  meal_cooldown_minutes: 15
  presence_grace_seconds: 3
  cats:
    - Ellie
  classifier_confidence: 0.55
  save_captures: true
  jpeg_quality: 80
  log_level: info
schema:
  rtsp_url: str
  detection_fps: int(1,15)
  motion_sensitivity: int(1,100)
  motion_min_area: int(100,1000000)
  eating_dwell_seconds: int(0,120)
  meal_cooldown_minutes: int(0,240)
  presence_grace_seconds: int(0,60)
  cats:
    - str
  classifier_confidence: float(0,1)
  save_captures: bool
  jpeg_quality: int(30,100)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
