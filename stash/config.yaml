---
name: Stash
version: "0.2.0"
slug: stash
description: >-
  Know where your stuff is. Every thing can live in several places — down to
  the shelf wall, the compartment and the box inside it.
url: https://github.com/Shnilj/home-assistant-plugins/tree/main/stash
codenotary: shniljj@gmail.com
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8096
panel_icon: mdi:archive-search
panel_title: Stash
# Persistent, user-visible folder for the inventory (stash.json). Mounted at
# /config inside the container; browse it via Samba / File editor under
# /addon_configs/<this-addon-slug>/.
map:
  - addon_config:rw
options:
  log_level: info
  data_file: /config/stash.json
schema:
  log_level: list(debug|info|warning|error)
  data_file: str
